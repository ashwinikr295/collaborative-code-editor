## 2. Real-Time Document Synchronization Flow

CoEdit uses **Yjs** (a Conflict-free Replicated Data Type) and **WebSockets** to synchronize text and cursor presence.

### The Text Synchronization Pipeline

\`\`\`mermaid
sequenceDiagram
    autonumber
    actor DevA as Developer A
    participant MonA as Monaco Editor A
    participant YjsA as Y.Doc A (Client)
    participant WS as WebSocket Server
    participant LDB as LevelDB (Server)
    participant YjsB as Y.Doc B (Client)
    participant MonB as Monaco Editor B
    actor DevB as Developer B

    DevA->>MonA: Types character "X"
    MonA->>YjsA: Trigger change event (insert "X" at index)
    Note over YjsA: CRDT calculates conflict-free update payload
    YjsA->>WS: Sends binary update message (y-protocols/sync)
    WS->>LDB: Store incremental update block
    WS->>YjsB: Broadcast binary update to Peer B
    Note over YjsB: Yjs merges update; resolves conflicts automatically
    YjsB->>MonB: Emit delta event (insert "X" at index)
    MonB->>DevB: Displays character "X" on screen
\`\`\`

When a user clicks "Run Code", the execution is coordinated globally. The terminal output is synchronized in real-time so all users see the run status and output.

\`\`\`mermaid

    participant Peer as Frontend Client B (Peer)

    User->>FE: Clicks "Run Code"

## 4. Key Architectural Topics (For Interviews)

Use these explanations to demonstrate deep technical understanding during interviews:

### 1. Conflict-Free Replicated Data Types (CRDTs) vs. Operational Transformation (OT)
* **What CoEdit uses**: Yjs (a high-performance CRDT library).
* **Comparison**:
  * **Operational Transformation (OT)** (used by Google Docs) requires a central server to coordinate, re-sequence, and rewrite operation indexes (e.g. shifts caused by concurrent edits) before broadcasting them. It is complex to implement and highly dependent on a stateful central server.
  * **CRDTs** (used by CoEdit) treat document changes as mathematically commutable operations. Changes can be applied in any order, and all clients are guaranteed to converge on the exact same state without needing a central coordinator to resolve conflicts. This makes Yjs resilient, fast, and capable of working in peer-to-peer or server-client setups.

### 2. LevelDB Persistence (\`y-leveldb\`)
* **How it works**: Yjs documents are composed of structural update fragments. Instead of serializing and saving the entire string to a database on every keystroke, the server uses \`y-leveldb\` to store updates **incrementally**.
* **Startup**: When a client creates a room connection, \`bindState\` loads the document state history from LevelDB, applies it to the room's server-side \`Y.Doc\`, and updates the client. Future incremental updates are stored in LevelDB on the fly.

### 3. Sandboxed Code Execution
* **Security & Isolation**: Arbitrary code execution is dangerous. In production, CoEdit compiles and executes code inside standard Docker images (\`gcc\` for C++, \`python\` for Python, \`node\` for JS).
* **Resource Limits**:
  * \`--memory="128m"\`: Caps container memory to 128MB.
  * \`--cpus="0.5"\`: Prevents CPU hogging by restricting the run to half a CPU core.
  * \`--network none\`: Prevents malicious code from calling out to external servers (securing the backend host from DDoS/scraping scripts).
  * **Timeout**: Node.js monitors the run and terminates it after a maximum threshold (5 seconds) to prevent infinite loops.

### 4. PaaS "Lite Mode" Fallback (The Render Fix)
* **Problem**: Cloud PaaS platforms like Render's free tier run backend instances inside their own virtualization containers, which blocks access to a local Docker daemon (\`Cannot connect to the Docker daemon\`).
* **Solution**: Implemented a **Host-based Lite Mode**. On startup, the server tests Docker availability (\`docker ps\`). If unreachable, it changes mode dynamically. Code is executed directly on the host using \`child_process.exec\` inside isolated, short-lived temporary directories, protected by strict script timeouts.

### 5. Cross-Device Line Endings Desync (The Windows vs. Mobile Fix)
* **The Bug**:
  1. Windows Monaco Editor inserts CRLF (\`\\r\\n\`) line endings. Mobile and UNIX browsers insert LF (\`\\n\`).
  2. When a Windows user typed newlines, Yjs sent CRLF to the mobile client.
  3. The mobile Monaco Editor automatically normalized these newlines to LF.
  4. The client's \`MonacoBinding\` interpreted this normalization as a manual edit deleting all \`\\r\` characters, and propagated this deletion back to Yjs.
  5. The Windows client received the deletions, applied them, but Windows Monaco immediately normalized the LFs back to CRLFs, triggering an insertion event back to mobile.
  6. This infinite loop crashed/froze the Monaco-Yjs text sync, while the independent WS awareness protocol (user counts, cursors) remained unaffected.
* **The Fix**: Standardized all editors by calling \`model.setEOL(monacoInstance.editor.EndOfLineSequence.LF)\` during mount, model updates, and value resets. This forces Monaco on Windows to output LF newlines, matching mobile devices and preserving sync index stability.
`;
